name: CI

on:
  push:
    branches:
      - feature/mlops-upgrade

  pull_request:

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.cpu.txt

      - name: Lint
        run: |
          python -m compileall src

      - name: Run tests
        env:
          HF_MODEL_ID: ${{ secrets.HF_MODEL_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_REVISION: ${{ secrets.HF_MODEL_REVISION }}
        run: |
          if [ -z "$HF_MODEL_ID" ]; then
            echo "HF_MODEL_ID EMPTY"
            exit 1
          else
            echo "HF_MODEL_ID PRESENT"
          fi

          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN EMPTY"
            exit 1
          else
            echo "HF_TOKEN PRESENT"
          fi
          PYTHONPATH=. pytest tests

      - name: Docker Build Test
        run: |
          docker build -t captcha-ocr-api .